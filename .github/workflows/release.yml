name: Release

# Push a tag like v2.1.0 to publish. Pre-release tags (v2.1.0-beta.1) publish an image and a
# GitHub pre-release, which in-app updates ignore (they follow /releases/latest).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v2.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $TAG is not vX.Y.Z"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

  test:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate:deploy
      - run: npm run audit:dependencies
      - run: node --test scripts/backup-host.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:crash
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: npm run test:recovery
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser

  # The only job that can read the signing key. Anything this job signs is trusted by every
  # install, so it is gated twice:
  #  - the `release` environment holds UPDATE_SIGNING_KEY (not a repo-wide secret), limited to
  #    v* tags and, ideally, a required reviewer, so a pushed tag can't sign on its own;
  #  - the tagged commit must already be on main, so code has to get through main's branch
  #    protection before it can be signed, not just be tagged on a side branch.
  bundle:
    needs: [meta, test, image-check, recovery-profile]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0
      - name: Refuse to sign commits that aren't on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${{ needs.meta.outputs.tag }} is not on main; refusing to sign"; exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package and sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: node scripts/make-bundle.mjs --require-signature
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle
          path: |
            release/poketracker-*.tar.gz
            release/poketracker-*.tar.gz.sha256
            release/poketracker-*.tar.gz.sig
          if-no-files-found: error

  image:
    needs: [meta, test, image-check, recovery-profile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          # Docker Hub's anonymous pull rate limit is shared across every GitHub-hosted
          # runner's IP range and gets exhausted easily; mirror.gcr.io is Google's public
          # read-through cache of Docker Hub and isn't subject to the same limit.
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Same Docker Hub congestion as above, this time for the buildkit image
          # itself: pull it from the mirror too instead of registry-1.docker.io.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.tag }},enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ needs.meta.outputs.tag }},enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            GIT_SHA=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Published last: running installs see the release (and offer the update) only once the
  # bundle and the image it may need are both available.
  publish:
    needs: [meta, bundle, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flags="--generate-notes --verify-tag"
          [ "$PRERELEASE" = "true" ] && flags="$flags --prerelease" || flags="$flags --latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "PokéTracker ${TAG#v}" $flags
          fi

  image-check:
    needs: meta
    name: Scan release candidate before signing or publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: poketracker:ci
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            GIT_SHA=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan runtime image (fail closed)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: poketracker:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln
          format: table
      - name: Smoke test
        run: |
          docker run -d --name pt -p 3000:3000 poketracker:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/health | grep -q '"ok":true'
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          docker logs pt 2>&1 | grep -q 'setup token'
      - if: failure()
        run: docker logs pt || true


  recovery-profile:
    needs: meta
    uses: ./.github/workflows/recovery-profile.yml
    with:
      ref: ${{ needs.meta.outputs.tag }}
