name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate:deploy
      - run: npm run audit:dependencies
      - run: node --test scripts/backup-host.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:crash
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: npm run test:recovery
      - name: Bundle (unsigned)
        run: node scripts/make-bundle.mjs --version "0.0.0-ci.${{ github.run_number }}"

  azure:
    name: Azure templates compile and are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The "Deploy to Azure" buttons use the committed JSON, so it must match the Bicep source.
      # Generator metadata (Bicep version) is ignored so a different local Bicep doesn't fail CI.
      - run: |
          cd deploy/azure
          for f in containerapps appservice vm; do
            az bicep build -f "$f.bicep" --stdout | jq -S 'del(.metadata)' > "/tmp/$f.json"
            jq -S 'del(.metadata)' "$f.json" | diff -u - "/tmp/$f.json" \
              || { echo "::error::deploy/azure/$f.json is stale. Run: az bicep build -f deploy/azure/$f.bicep"; exit 1; }
          done

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: poketracker:ci
          build-args: |
            VERSION=0.0.0-ci.${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan runtime image (fail closed)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: poketracker:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln
          format: table
      - name: Smoke test
        run: |
          docker run -d --name pt -p 3000:3000 poketracker:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/health | grep -q '"ok":true'
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          docker logs pt 2>&1 | grep -q 'setup token'
      - if: failure()
        run: docker logs pt || true

  browser:
    name: Chromium, WebKit, mobile and axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
